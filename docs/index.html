<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按流行歌曲、外文歌曲、纯音乐和影视原声浏览个人音乐收藏">
  <title>我的音乐收藏</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>[hidden]{display:none!important}</style>
</head>
<body>
  <!-- 全局吸顶导航栏 -->
  <nav class="site-navbar" aria-label="全局导航">
    <div class="navbar-inner">
      <a class="navbar-brand" href="./" aria-label="我的音乐收藏首页">
        <svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="brand-title">我的音乐收藏</span>
      </a>
      <div class="navbar-actions">
        <button type="button" id="theme-toggle-btn" class="navbar-action-btn theme-toggle" aria-label="切换外观主题" title="切换外观主题 (D)">
          <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="https://github.com/yuzhounh/music-collection" target="_blank" rel="noopener noreferrer" class="navbar-action-btn github-link" aria-label="GitHub 源代码" title="GitHub 源代码">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
        </a>
        <button type="button" id="mobile-drawer-toggle" class="mobile-drawer-toggle" aria-label="打开导航与设置菜单" title="打开导航与设置菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- 移动端侧滑抽屉菜单（全局设置与功能导航） -->
  <div id="mobile-drawer-layer" class="mobile-drawer-layer" hidden role="presentation">
    <div id="mobile-drawer-backdrop" class="mobile-drawer-backdrop"></div>
    <aside class="mobile-drawer-panel" role="dialog" aria-modal="true" aria-label="快捷设置与导航">
      <div class="mobile-drawer-head">
        <div class="drawer-brand">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <span>音乐收藏</span>
        </div>
        <button type="button" id="mobile-drawer-close" class="mobile-drawer-close" aria-label="关闭菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="mobile-drawer-body">
        <div class="mobile-menu-section">
          <span class="mobile-menu-section-title">功能导航</span>
          <nav class="mobile-nav-list">
            <button type="button" class="mobile-nav-item" id="mobileDrawerCategoryBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
              <span>切换音乐类别</span>
            </button>
            <button type="button" class="mobile-nav-item" id="mobileDrawerSearchBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <span>搜索音乐收藏</span>
            </button>
          </nav>
        </div>
      </div>

      <div class="mobile-drawer-foot">
        <div class="mobile-foot-row">
          <span class="mobile-foot-label">外观主题</span>
          <button type="button" id="mobile-theme-toggle" class="mobile-drawer-action-btn" aria-label="切换外观主题" title="切换外观主题">
            <svg id="drawer-theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="drawer-theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
        <a href="https://github.com/yuzhounh/music-collection" target="_blank" rel="noopener noreferrer" class="mobile-foot-row mobile-foot-link" aria-label="GitHub 源代码">
          <span class="mobile-foot-label">GitHub 仓库</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </div>
    </aside>
  </div>

  <!-- 移动端独立“切换音乐类别”弹窗 Modal -->
  <div id="switch-category-modal" class="modal-layer" hidden role="dialog" aria-modal="true" aria-labelledby="switch-category-modal-title">
    <div class="modal-backdrop" id="switch-category-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="switch-category-modal-title" class="modal-title">切换音乐类别</h3>
        <button type="button" class="modal-close-btn" id="closeSwitchCategoryModal" aria-label="关闭类别切换弹窗">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-tip">选择要查看的音乐分类：</p>
        <div class="modal-category-list" id="modalCategoryList">
          <!-- 动态注入分类按钮 -->
        </div>
      </div>
    </div>
  </div>

  <header class="hero">
    <div class="hero__inner">
      <p class="eyebrow">PERSONAL MUSIC ARCHIVE</p>
      <h1>我的音乐收藏</h1>
      <p class="intro">汇集网易云音乐与酷我音乐收藏，合并去重后按类别浏览。</p>
      <div class="hero__stats" aria-label="收藏统计">
        <span><strong id="total-stat">—</strong> 首歌曲</span>
        <span><strong id="category-stat">—</strong> 个类别</span>
        <span><strong id="platform-stat">—</strong> 个来源平台</span>
      </div>
    </div>
  </header>

  <main class="page">
    <nav id="category-tabs" class="tabs" aria-label="音乐类别">
      <button class="tab is-active" type="button" data-category="all">全部 <span id="all-count"></span></button>
    </nav>

        <!-- 移动端当前分类提示与切换按钮 -->
    <div class="mobile-filter-bar" id="mobileFilterBar">
      <div class="mobile-filter-info">
        <span class="mobile-filter-label">当前分类</span>
        <strong class="mobile-filter-tag" id="mobileCurrentCategoryTag">全部</strong>
        <span class="mobile-filter-count" id="mobileFilterCount"></span>
      </div>
      <button type="button" class="mobile-filter-switch-btn" id="mobileOpenCategoryModalBtn" aria-label="切换音乐类别">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 6h16M7 12h10M10 18h4"/>
        </svg>
        <span>切换类别</span>
      </button>
    </div>
    <section class="collection">
      <div class="collection__head">
        <div>
          <p class="section-label">MUSIC COLLECTION</p>
          <h2 id="collection-title">全部</h2>
        </div>
        <div class="controls">
          <label class="search">
            <span class="sr-only">搜索音乐</span>
            <input id="search" type="search" placeholder="搜索歌名、歌手、专辑或原歌单" autocomplete="off" disabled>
          </label>
          <label class="select-control">来源
            <select id="platform-filter" disabled>
              <option value="all">全部平台</option>
              <option value="netease">网易云音乐</option>
              <option value="kuwo">酷我音乐</option>
            </select>
          </label>
          <label class="select-control">每页
            <select id="page-size" disabled>
              <option value="50">50</option>
              <option value="100" selected>100</option>
              <option value="200">200</option>
              <option value="500">500</option>
            </select>
          </label>
        </div>
      </div>

      <div class="status-row">
        <p id="status" class="status">正在载入音乐收藏…</p>
        <p id="updated" class="updated"></p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="rank">#</th>
              <th>歌曲</th>
              <th>歌手</th>
              <th class="album-column">专辑</th>
              <th class="category-column">类别</th>
              <th>播放 / 来源</th>
            </tr>
          </thead>
          <tbody id="music-rows"></tbody>
        </table>
      </div>

      <nav class="pagination" aria-label="歌曲分页">
        <button id="first-page" type="button" disabled>首页</button>
        <button id="previous-page" type="button" disabled>上一页</button>
        <label>第 <input id="page-number" type="number" min="1" value="1" disabled> 页</label>
        <span id="page-total">/ 1 页</span>
        <button id="jump-page" type="button" disabled>跳转</button>
        <button id="next-page" type="button" disabled>下一页</button>
        <button id="last-page" type="button" disabled>末页</button>
      </nav>
    </section>
  </main>

  <footer>
    <span>歌曲信息来自个人收藏歌单，仅用于整理与索引；本站不存储或提供音频文件。</span>
    <span id="footer-updated"></span>
  </footer>
  <script src="assets/app.js" defer></script>
</body>
</html>
